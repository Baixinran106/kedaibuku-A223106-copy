version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: de_student
      POSTGRES_PASSWORD: de_pass
      POSTGRES_DB: kedaibuku
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_student -d kedaibuku"]
      interval: 5s
      timeout: 5s
      retries: 5

  objectstore:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: kedai-admin
      MINIO_ROOT_PASSWORD: ChangeMe12345
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
